name: Deploy Azure Function

on:
  push:
    branches:
      - main
    paths:
      - 'Api/**'
      - 'Shared/**'
      - '.github/workflows/deploy-azure-function.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Api/**'
      - 'Shared/**'
      - '.github/workflows/deploy-azure-function.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - dev
          - staging
          - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore Api/Api.csproj

      - name: Build
        run: dotnet build Api/Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Api/Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: ./publish
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app
          path: ./publish

      - name: Set Function App Name
        run: |
          ENV_SUFFIX="${{ github.event.inputs.environment || 'production' }}"
          echo "FUNCTION_APP_NAME=${{ secrets.AZURE_FUNCTION_APP_NAME }}-${ENV_SUFFIX}" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Function
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ./publish

      - name: Azure Logout
        run: az logout
        if: always()

      - name: Deployment Summary
        run: |
          echo "### Deployment Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Function App**: ${{ env.FUNCTION_APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
