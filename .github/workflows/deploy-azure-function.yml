name: Deploy Azure Function

on:
  push:
    branches:
      - main
    paths:
      - 'Api/**'
      - 'Shared/**'
      - '.github/workflows/deploy-azure-function.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Api/**'
      - 'Shared/**'
      - '.github/workflows/deploy-azure-function.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - dev
          - staging
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore Api/Api.csproj

      - name: Build
        run: dotnet build Api/Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Api/Api.csproj --configuration Release --no-build --output ./publish

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore Api/Api.csproj

      - name: Build
        run: dotnet build Api/Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Api/Api.csproj --configuration Release --no-build --output ./publish

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_DIRECTORY_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # We are forcing a different flow because of
          #    MSAL issues at time of writing
          enable-AzPSSession: false
          allow-no-subscriptions: true

      - name: Deploy to Azure Function
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}-${{ github.event.inputs.environment || 'production' }}
          package: ./publish

      - name: Azure Logout
        run: az logout
        if: always()

      - name: Deployment Summary
        run: |
          echo "### Deployment Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Function App**: ${{ secrets.AZURE_FUNCTION_APP_NAME }}-${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
